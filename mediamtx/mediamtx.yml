###############################################################################
# mediamtx.yml — pi-cam
#
# Copy to /etc/mediamtx/mediamtx.yml on the Pi (or wherever your install uses).
# Replace the placeholder password hashes before deploying — see
# docs/SETUP.md for how to generate them. Never commit real password hashes
# or plaintext passwords to this repo.
###############################################################################

# --- Network binding -----------------------------------------------------
# Nothing here is meant to be reachable directly, from the LAN or the
# tailnet or anywhere else — every address is bound to loopback only. The
# ONLY way in is through Tailscale Funnel, which runs as a local reverse
# proxy on the Pi and connects to these ports over 127.0.0.1 (see
# scripts/tailscale-funnel.sh). scripts/firewall.sh adds a belt-and-suspenders
# nftables rule to drop any external packets to these ports too, in case of
# a binding misconfiguration.
#
# Viewer-facing playback is HLS, not WebRTC: Funnel proxies plain HTTPS, and
# WebRTC's UDP media (ICE) can't ride through that without a public TURN
# relay. HLS runs entirely over HTTPS so it works through Funnel with no
# extra infrastructure. Using the Low-Latency HLS (LL-HLS) variant gets this
# down to roughly 1-2s end-to-end instead of classic HLS's 6-10s — still not
# as instant as WebRTC, but much closer. Both hls.js (lowLatencyMode) and
# native Safari/iOS HLS understand LL-HLS's #EXT-X-PART tags.
rtspAddress: 127.0.0.1:8554
webrtcAddress: 127.0.0.1:8889
hlsAddress: 127.0.0.1:8888
apiAddress: 127.0.0.1:9997
metricsAddress: 127.0.0.1:9998

rtsp: yes            # localhost-only, used solely for ffmpeg to publish
rtmp: no
srt: no
hls: yes             # primary viewer path, proxied out via Tailscale Funnel
hlsVariant: lowLatency  # LL-HLS (fMP4 + partial segments) for ~1-2s latency
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentCount: 7  # MediaMTX's minimum for lowLatency; playlist window is longer, but the live edge (what players join at) stays close to real-time
webrtc: no           # disabled: not reachable through Funnel without a TURN relay (see note above)
api: no              # leave off unless you need the HTTP control API
metrics: no

# --- Authentication --------------------------------------------------------
authMethod: internal

authInternalUsers:
  # Person 1
  - user: person1
    # Generate with: mediamtx-hash-password (or see docs/SETUP.md for the
    # sha256 one-liner). Do NOT store plaintext here.
    pass: sha256:REPLACE_WITH_PERSON1_HASH
    ips: []
    permissions:
      - action: read
        path: home

  # Person 2
  - user: person2
    pass: sha256:REPLACE_WITH_PERSON2_HASH
    ips: []
    permissions:
      - action: read
        path: home

  # The capture process (ffmpeg) publishing the stream from the webcam.
  # Only allowed to publish, never to read other paths, and locked to
  # localhost since ffmpeg runs on the same Pi.
  - user: publisher
    pass: sha256:REPLACE_WITH_PUBLISHER_HASH
    ips: ['127.0.0.1']
    permissions:
      - action: publish
        path: home

  # Deny everything else by default (no catch-all "any" user below this).

# --- Paths -------------------------------------------------------------
paths:
  home:
    # The webcam/mic only run while someone is actually watching, not 24/7:
    # mediamtx runs scripts/mediamtx-on-demand.sh itself the moment a reader
    # (HLS) requests the path and no one's publishing yet, and SIGINTs it
    # once runOnDemandCloseAfter has passed with no readers left — no
    # separate systemd unit or custom scheduling needed, this is a native
    # MediaMTX feature. That script plays a connect chime then execs into
    # the real ffmpeg capture command (so MediaMTX's SIGINT targets it
    # directly, not a wrapper), which RTSP-pushes back into mediamtx itself
    # as the `publisher` user below. runOnUnDemand plays the disconnect
    # chime immediately, independent of the close-after grace period.
    # $RTSP_PORT/$MTX_PATH are mediamtx's own substitutions;
    # $PICAM_AUDIO_DEVICE/$PICAM_PUBLISHER_PASS come from mediamtx.service's
    # EnvironmentFile — both scripts need them, so they're set here, not in
    # the scripts themselves.
    runOnDemand: /etc/picam/mediamtx-on-demand.sh
    runOnDemandRestart: yes
    runOnDemandStartTimeout: 15s
    runOnDemandCloseAfter: 60s
    runOnUnDemand: /etc/picam/mediamtx-on-undemand.sh
